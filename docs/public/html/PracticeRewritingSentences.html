<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English sentence modification practice V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sidebar-subcategory-btn.active {
            background-color: #3b82f6; /* bg-blue-500 */
            color: white;
            font-weight: 500;
        }
        .sidebar-subcategory-btn.completed {
            background-color: #dcfce7; /* bg-green-100 */
            color: #166534; /* text-green-800 */
        }
        .sidebar-subcategory-btn.completed .progress-text {
            color: #16a34a; /* text-green-600 */
        }
        .sidebar-main-category {
            cursor: pointer;
        }
        .sidebar-main-category.completed .main-category-title {
            color: #16a34a; /* text-green-600 */
        }
        .subcategory-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        #feedback-section.incorrect {
            background-color: #fef2f2; /* bg-red-50 */
            border-color: #f87171; /* border-red-400 */
            color: #b91c1c; /* text-red-700 */
        }
        #toast {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            transform: translateY(-20px);
        }
    </style>
</head>
<body class="bg-slate-100">

<div class="flex flex-col md:flex-row min-h-screen">
    <!-- Sidebar -->
    <aside class="w-full md:w-80 bg-white p-6 border-b md:border-r border-slate-200 flex-shrink-0">
        <h1 class="text-xl font-bold text-slate-800 mb-1">English sentence modification practice</h1>
        <p class="text-sm text-slate-500 mb-6">Choose a topic for practice</p>
        <nav id="category-container" class="space-y-2">
            <!-- Accordion menu will be inserted here -->
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10">
        <div class="w-full max-w-3xl mx-auto">
            <!-- Theme Description -->
            <div id="theme-description-card" class="mb-6 bg-green-50 border-l-4 border-green-400 text-green-800 p-4 rounded-lg">
                <h2 id="theme-title" class="font-bold text-lg"></h2>
                <p id="theme-description" class="mt-1 text-sm md:text-base"></p>
            </div>

            <!-- Main Exercise Card -->
            <div id="exercise-card" class="bg-white rounded-2xl shadow-lg p-6 md:p-8 space-y-6">
                <!-- Question Section -->
                <div>
                    <label class="font-semibold text-slate-700 text-lg">Question</label>
                    <p id="instruction" class="text-slate-600 mb-2 mt-1"></p>
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <p id="sentence" class="text-slate-900 font-medium text-base md:text-lg"></p>
                        <p id="translation" class="text-slate-500 text-sm mt-2"></p>
                    </div>
                </div>

                <!-- Answer Section -->
                <div id="answer-section">
                    <label for="answer-input" class="font-semibold text-slate-700 text-lg">Your Answer</label>
                    <p id="target-translation" class="text-slate-500 text-sm mt-1 mb-2"></p>
                    <div class="mt-1 flex items-center justify-between bg-white p-2 rounded-lg border border-slate-200">
                        <textarea id="answer-input" rows="2" class="w-full p-2 text-slate-900 bg-transparent border-none focus:ring-0 resize-none" placeholder="在这里输入改写后的句子..."></textarea>
                    </div>
                </div>

                <!-- Feedback Section (Hidden by default) -->
                <div id="feedback-section" class="p-4 rounded-lg border-l-4" style="display: none;">
                </div>

                <!-- Note Section (Hidden by default) -->
                <div id="note-section" class="bg-blue-50 border-l-4 border-blue-400 text-blue-800 p-4 rounded-lg" style="display: none;">
                    <h3 class="font-semibold text-lg mb-2">Note tips</h3>
                    <p id="note-content" class="text-sm md:text-base leading-relaxed"></p>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row justify-center items-center pt-4 space-y-3 sm:space-y-0 sm:space-x-4">
                    <button id="hint-btn" class="w-full sm:w-auto bg-slate-200 text-slate-700 font-bold py-3 px-8 rounded-full hover:bg-slate-300 active:scale-95 transition-transform">
                        Show hint
                    </button>
                    <button id="skip-btn" class="w-full sm:w-auto bg-slate-200 text-slate-700 font-bold py-3 px-8 rounded-full hover:bg-slate-300 active:scale-95 transition-transform">
                        Skip and finish
                    </button>
                    <button id="action-btn" class="w-full sm:w-auto bg-blue-600 text-white font-bold py-3 px-8 rounded-full hover:bg-blue-700 active:scale-95 transition-transform shadow-lg hover:shadow-xl">
                        Submit the answer
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed top-5 right-5 bg-green-500 text-white py-3 px-5 rounded-lg shadow-lg opacity-0"></div>

                        { sentence: "If we (miss) the bus, we (take) a taxi.", translation: "如果我们错过了公共汽车，我们就打车。", note: "<b>提示:</b> If 从句用一般现在时，主句用 will + 动词原形。", answer: ["if we miss the bus, we will take a taxi."], targetTranslation: "如果我们错过了公共汽车，我们就打车。" },
                        { sentence: "If you (not hurry), you (be) late.", translation: "如果你不快点，你就会迟到。", note: "<b>提示:</b> If 从句用一般现在时，主句用 will + 动词原形。", answer: ["if you do not hurry, you will be late.", "if you don't hurry, you will be late."], targetTranslation: "如果你不快点，你就会迟到。" },

                        { sentence: "If the weather (be) nice, we (go) for a picnic.", translation: "如果天气好，我们就去野餐。", note: "<b>提示:</b> If 从句用一般现在时，主句用 will + 动词原形。", answer: ["if the weather is nice, we will go for a picnic."], targetTranslation: "如果天气好，我们就去野餐。" },
                        { sentence: "If I (have) enough time, I (visit) you.", translation: "如果我有足够的时间，我会去看你。", note: "<b>提示:</b> If 从句用一般现在时，主句用 will + 动词原形。", answer: ["if i have enough time, i will visit you."], targetTranslation: "如果我有足够的时间，我会去看你。" },
                        { sentence: "If she (call) me, I (let) you know.", translation: "如果她给我打电话，我会让你知道。", note: "<b>提示:</b> If 从句用一般现在时，主句用 will + 动词原形。", answer: ["if she calls me, i will let you know."], targetTranslation: "如果她给我打电话，我会让你知道。" },
                        { sentence: "If they (invite) us, we (go) to their party.", translation: "如果他们邀请我们，我们就会去他们的派对。", note: "<b>提示:</b> If 从句用一般现在时，主句用 will + 动词原形。", answer: ["if they invite us, we will go to their party."], targetTranslation: "如果他们邀请我们，我们就会去他们的派对。" }
                    ]},
                { name: "第二条件句", description: "描述一个与现在或未来事实相反的假设或想象。结构: If + 一般过去时, would + 动词原形。", instruction: "请用括号中动词的正确形式填空。", questions: [
                        { sentence: "If I (have) more money, I (buy) a car.", translation: "如果我有更多的钱，我就会买一辆车。", note: "<b>提示:</b> If 从句用一般过去时，主句用 would + 动词原形。", answer: ["if i had more money, i would buy a car."], targetTranslation: "如果我有更多的钱，我就会买一辆车。" },
                        { sentence: "If I (be) you, I (take) the job.", translation: "如果我是你，我就会接受这份工作。", note: "<b>提示:</b> If 从句中 be 动词常用 were。", answer: ["if i were you, i would take the job."], targetTranslation: "如果我是你，我就会接受这份工作。" },
                        { sentence: "If he (know) the answer, he (tell) us.", translation: "如果他知道答案，他会告诉我们。", note: "<b>提示:</b> If 从句用一般过去时，主句用 would + 动词原形。", answer: ["if he knew the answer, he would tell us."], targetTranslation: "如果他知道答案，他会告诉我们。" },
                        { sentence: "If we (live) in a bigger house, we (have) a dog.", translation: "如果我们住在一个更大的房子里，我们就会养一只狗。", note: "<b>提示:</b> If 从句用一般过去时，主句用 would + 动词原形。", answer: ["if we lived in a bigger house, we would have a dog."], targetTranslation: "如果我们住在一个更大的房子里，我们就会养一只狗。" },
                        { sentence: "If she (not be) so busy, she (join) us.", translation: "如果她不那么忙，她会加入我们。", note: "<b>提示:</b> If 从句用一般过去时，主句用 would + 动词原形。", answer: ["if she were not so busy, she would join us.", "if she wasn't so busy, she would join us."], targetTranslation: "如果她不那么忙，她会加入我们。" },
                        { sentence: "If I (can) fly, I (travel) the world.", translation: "如果我能飞，我会环游世界。", note: "<b>提示:</b> If 从句用一般过去时 (could)，主句用 would + 动词原形。", answer: ["if i could fly, i would travel the world."], targetTranslation: "如果我能飞，我会环游世界。" },
                        { sentence: "What you (do) if you (win) the lottery?", translation: "如果你中了彩票，你会做什么？", note: "<b>提示:</b> If 从句用一般过去时，主句用 would + 动词原形。", answer: ["what would you do if you won the lottery?"], targetTranslation: "如果你中了彩票，你会做什么？" },
                        { sentence: "If I (be) the president, I (lower) taxes.", translation: "如果我是总统，我会减税。", note: "<b>提示:</b> If 从句中 be 动词常用 were。", answer: ["if i were the president, i would lower taxes."], targetTranslation: "如果我是总统，我会减税。" },
                        { sentence: "If they (have) more time, they (visit) more places.", translation: "如果他们有更多的时间，他们会参观更多的地方。", note: "<b>提示:</b> If 从句用一般过去时，主句用 would + 动词原形。", answer: ["if they had more time, they would visit more places."], targetTranslation: "如果他们有更多的时间，他们会参观更多的地方。" },
                        { sentence: "If it (not rain), we (go) to the park.", translation: "如果不下雨，我们就会去公园。", note: "<b>提示:</b> If 从句用一般过去时，主句用 would + 动词原形。", answer: ["if it did not rain, we would go to the park.", "if it didn't rain, we would go to the park."], targetTranslation: "如果不下雨，我们就会去公园。" }
                    ]},
                { name: "第三条件句", description: "描述一个与过去事实相反的假设。结构: If + 过去完成时, would have + 动词过去分词。", instruction: "请用括号中动词的正确形式填空。", questions: [
                        { sentence: "If I (leave) earlier, I (catch) the train.", translation: "如果我早点离开，我就赶上火车了。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if i had left earlier, i would have caught the train."], targetTranslation: "如果我早点离开，我就赶上火车了。" },
                        { sentence: "If she (study), she (pass) the exam.", translation: "如果她学习了，她就会通过考试。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if she had studied, she would have passed the exam."], targetTranslation: "如果她学习了，她就会通过考试。" },
                        { sentence: "If we (not miss) the bus, we (arrive) on time.", translation: "如果我们没有错过公共汽车，我们就会准时到达。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if we had not missed the bus, we would have arrived on time."], targetTranslation: "如果我们没有错过公共汽车，我们就会准时到达。" },
                        { sentence: "If he (be) more careful, he (not make) that mistake.", translation: "如果他更小心一点，他就不会犯那个错误了。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if he had been more careful, he would not have made that mistake."], targetTranslation: "如果他更小心一点，他就不会犯那个错误了。" },
                        { sentence: "If I (know) you were coming, I (bake) a cake.", translation: "如果我知道你要来，我就会烤一个蛋糕。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if i had known you were coming, i would have baked a cake."], targetTranslation: "如果我知道你要来，我就会烤一个蛋糕。" },
                        { sentence: "If they (take) my advice, they (not lose) their money.", translation: "如果他们听了我的建议，他们就不会亏钱了。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if they had taken my advice, they would not have lost their money."], targetTranslation: "如果他们听了我的建议，他们就不会亏钱了。" },
                        { sentence: "If you (tell) me about the problem, I (help) you.", translation: "如果你告诉我这个问题，我就会帮助你了。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if you had told me about the problem, i would have helped you."], targetTranslation: "如果你告诉我这个问题，我就会帮助你了。" },
                        { sentence: "If it (not rain) yesterday, we (go) on a picnic.", translation: "如果昨天没下雨，我们就去野餐了。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if it had not rained yesterday, we would have gone on a picnic."], targetTranslation: "如果昨天没下雨，我们就去野餐了。" },
                        { sentence: "If I (see) him, I (say) hello.", translation: "如果我见到他，我就会打招呼了。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if i had seen him, i would have said hello."], targetTranslation: "如果我见到他，我就会打招呼了。" },
                        { sentence: "If she (not be) ill, she (come) to the party.", translation: "如果她没生病，她就会来参加派对了。", note: "<b>提示:</b> If 从句用过去完成时，主句用 would have + 过去分词。", answer: ["if she had not been ill, she would have come to the party."], targetTranslation: "如果她没生病，她就会来参加派对了。" }
                    ]}
            ]
        }
    };

    // DOM Elements
    const categoryContainer = document.getElementById('category-container');
    const themeTitleEl = document.getElementById('theme-title');
    const themeDescriptionEl = document.getElementById('theme-description');
    const noteSection = document.getElementById('note-section');
    const noteContent = document.getElementById('note-content');
    const instructionEl = document.getElementById('instruction');
    const sentenceEl = document.getElementById('sentence');
    const translationEl = document.getElementById('translation');
    const targetTranslationEl = document.getElementById('target-translation');
    const answerInput = document.getElementById('answer-input');
    const answerSection = document.getElementById('answer-section');
    const feedbackSection = document.getElementById('feedback-section');
    const hintBtn = document.getElementById('hint-btn');
    const skipBtn = document.getElementById('skip-btn');
    const actionBtn = document.getElementById('action-btn');
    const exerciseCard = document.getElementById('exercise-card');
    const toastEl = document.getElementById('toast');

    let progressState = {};
    let currentMainCategory = Object.keys(exerciseData)[0];
    let currentSubCategory = exerciseData[currentMainCategory].subcategories[0].name;
    let currentQuestionIndex = 0;
    let appState = 'submit'; // 'submit', 'reset'

    function initializeProgress() {
        Object.keys(exerciseData).forEach(mainCat => {
            progressState[mainCat] = {};
            exerciseData[mainCat].subcategories.forEach(subCat => {
                progressState[mainCat][subCat.name] = Array(subCat.questions.length).fill(false);
            });
        });
    }

    function setupCategories() {
        Object.keys(exerciseData).forEach(mainCategory => {
            const mainCatDiv = document.createElement('div');

            const mainCatHeader = document.createElement('div');
            mainCatHeader.className = 'sidebar-main-category flex justify-between items-center p-2 rounded-lg hover:bg-slate-100';
            mainCatHeader.dataset.mainCategory = mainCategory;
            mainCatHeader.innerHTML = `<span class="font-semibold text-slate-700 main-category-title">${mainCategory}</span>
                                           <svg class="w-4 h-4 text-slate-500 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>`;

            const subCatList = document.createElement('div');
            subCatList.className = 'subcategory-list pl-4 mt-1 space-y-1';

            exerciseData[mainCategory].subcategories.forEach(subCategory => {
                const subCatBtn = document.createElement('button');
                subCatBtn.dataset.mainCategory = mainCategory;
                subCatBtn.dataset.subCategory = subCategory.name;
                subCatBtn.className = 'sidebar-subcategory-btn w-full text-left px-3 py-1.5 text-sm text-slate-600 rounded-md hover:bg-slate-100 transition-colors flex justify-between items-center';

                const titleSpan = document.createElement('span');
                titleSpan.textContent = subCategory.name;

                const progressSpan = document.createElement('span');
                progressSpan.className = 'progress-text text-xs text-slate-400 font-mono';

                subCatBtn.appendChild(titleSpan);
                subCatBtn.appendChild(progressSpan);

                subCatBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentMainCategory = mainCategory;
                    currentSubCategory = subCategory.name;

                    document.querySelectorAll('.sidebar-subcategory-btn').forEach(btn => btn.classList.remove('active'));
                    subCatBtn.classList.add('active');

                    displayExerciseForSubcategory();
                });
                subCatList.appendChild(subCatBtn);
            });

            mainCatHeader.addEventListener('click', () => {
                const icon = mainCatHeader.querySelector('svg');
                const isOpening = !subCatList.style.maxHeight || subCatList.style.maxHeight === '0px';

                document.querySelectorAll('.subcategory-list').forEach(list => {
                    if(list !== subCatList) {
                        list.style.maxHeight = null;
                        list.previousElementSibling.querySelector('svg').style.transform = 'rotate(0deg)';
                    }
                });

                if (isOpening) {
                    subCatList.style.maxHeight = subCatList.scrollHeight + "px";
                    icon.style.transform = 'rotate(180deg)';
                } else {
                    subCatList.style.maxHeight = null;
                    icon.style.transform = 'rotate(0deg)';
                }
            });

            mainCatDiv.appendChild(mainCatHeader);
            mainCatDiv.appendChild(subCatList);
            categoryContainer.appendChild(mainCatDiv);
        });
        updateAllSidebarProgress();
    }

    function updateAllSidebarProgress() {
        document.querySelectorAll('.sidebar-subcategory-btn').forEach(btn => {
            const mainCat = btn.dataset.mainCategory;
            const subCat = btn.dataset.subCategory;
            const progress = progressState[mainCat][subCat];
            const completedCount = progress.filter(Boolean).length;
            const totalCount = progress.length;

            const progressSpan = btn.querySelector('.progress-text');
            if (completedCount === totalCount) {
                progressSpan.textContent = `[ 已完成 ]`;
                btn.classList.add('completed');
            } else {
                progressSpan.textContent = `[ ${completedCount}/${totalCount} ]`;
                btn.classList.remove('completed');
            }
        });

        document.querySelectorAll('.sidebar-main-category').forEach(header => {
            const mainCat = header.dataset.mainCategory;
            const allSubCompleted = exerciseData[mainCat].subcategories.every(subCat => {
                const progress = progressState[mainCat][subCat.name];
                return progress.filter(Boolean).length === progress.length;
            });

            if (allSubCompleted) {
                header.classList.add('completed');
            } else {
                header.classList.remove('completed');
            }
        });
    }


    function updateThemeDescription() {
        const subCategoryData = exerciseData[currentMainCategory].subcategories.find(sc => sc.name === currentSubCategory);
        if(subCategoryData) {
            themeTitleEl.textContent = subCategoryData.name;
            themeDescriptionEl.innerHTML = subCategoryData.description;
        }
    }

    function displayExercise(questionIndex) {
        currentQuestionIndex = questionIndex;
        const subCategoryData = exerciseData[currentMainCategory].subcategories.find(sc => sc.name === currentSubCategory);
        const exercise = subCategoryData.questions[questionIndex];

        // Reset UI for new question
        appState = 'submit';
        actionBtn.textContent = '提交答案';
        answerInput.value = exercise.sentence;
        answerInput.disabled = false;
        feedbackSection.style.display = 'none';
        noteSection.style.display = 'none';
        hintBtn.textContent = '显示提示';
        hintBtn.style.display = 'inline-flex';
        skipBtn.style.display = 'inline-flex';
        answerSection.style.display = 'block';

        exerciseCard.classList.remove('fade-in');
        void exerciseCard.offsetWidth;

        noteContent.innerHTML = exercise.note;
        instructionEl.textContent = subCategoryData.instruction;
        sentenceEl.innerHTML = exercise.sentence;
        translationEl.textContent = exercise.translation;
        targetTranslationEl.textContent = `Tips: ${exercise.targetTranslation || ''}`;

        exerciseCard.classList.add('fade-in');
    }

    function displayCompletionMessage() {
        appState = 'reset';
        instructionEl.textContent = "You can choose other topics to continue practicing or reset the progress of this section.";
        sentenceEl.innerHTML = "<span class='text-2xl'>🎉</span> Congratulations！";
        translationEl.textContent = "You have completed all the exercises in this section.";
        answerSection.style.display = 'none';
        feedbackSection.style.display = 'none';
        noteSection.style.display = 'none';
        hintBtn.style.display = 'none';
        skipBtn.style.display = 'none';
        actionBtn.textContent = 'Reset this section';
    }

    function displayExerciseForSubcategory() {
        updateThemeDescription();
        const progress = progressState[currentMainCategory][currentSubCategory];
        const nextQuestionIndex = progress.indexOf(false);

        if (nextQuestionIndex !== -1) {
            displayExercise(nextQuestionIndex);
        } else {
            displayCompletionMessage();
        }
    }

    function validateAnswer() {
        const subCategoryData = exerciseData[currentMainCategory].subcategories.find(sc => sc.name === currentSubCategory);
        const correctAnswers = subCategoryData.questions[currentQuestionIndex].answer;
        const userAnswer = answerInput.value.trim().toLowerCase().replace(/[.,?']/g, '').replace(/\s+/g, '');

        return correctAnswers.some(correctAnswer => userAnswer === correctAnswer.toLowerCase().replace(/[.,?']/g, '').replace(/\s+/g, ''));
    }

    function showFeedback(isCorrect) {
        if(isCorrect) {
            showToast('Correct!');
            return true;
        } else {
            feedbackSection.style.display = 'block';
            const subCategoryData = exerciseData[currentMainCategory].subcategories.find(sc => sc.name === currentSubCategory);
            const correctAnswer = subCategoryData.questions[currentQuestionIndex].answer[0];
            feedbackSection.className = 'p-4 rounded-lg border-l-4 incorrect';
            feedbackSection.innerHTML = `❌  <strong>Mistake</strong> <br>The correct answer is: <strong class="font-semibold">${correctAnswer}</strong>`;
            return false;
        }
    }

    function showToast(message) {
        toastEl.textContent = message;
        toastEl.style.opacity = '1';
        toastEl.style.transform = 'translateY(0)';
        setTimeout(() => {
            toastEl.style.opacity = '0';
            toastEl.style.transform = 'translateY(-20px)';
        }, 1500);
    }

    function handleActionClick() {
        if (appState === 'submit') {
            const isCorrect = validateAnswer();

            if (isCorrect) {
                showToast('Correct!');
                progressState[currentMainCategory][currentSubCategory][currentQuestionIndex] = true;
                answerInput.disabled = true;

                setTimeout(() => {
                    updateAllSidebarProgress();
                    displayExerciseForSubcategory();
                }, 1000);
            } else {
                showFeedback(false);
                // Allow user to re-submit
            }

        } else if (appState === 'reset') {
            progressState[currentMainCategory][currentSubCategory].fill(false);
            updateAllSidebarProgress();
            displayExerciseForSubcategory();
        }
    }

    function handleSkipClick() {
        progressState[currentMainCategory][currentSubCategory][currentQuestionIndex] = true;
        updateAllSidebarProgress();
        displayExerciseForSubcategory();
    }

    function handleHintClick() {
        const isHidden = noteSection.style.display === 'none';
        if(isHidden) {
            noteSection.style.display = 'block';
            hintBtn.textContent = 'Hidden hint';
        } else {
            noteSection.style.display = 'none';
            hintBtn.textContent = 'Show hint';
        }
    }

    window.onload = () => {
        // This is the correct place for the full data
        const fullExerciseData = exerciseData; // Use the global one

        initializeProgress();
        setupCategories();

        // Add event listeners after elements are guaranteed to exist
        actionBtn.addEventListener('click', handleActionClick);
        skipBtn.addEventListener('click', handleSkipClick);
        hintBtn.addEventListener('click', handleHintClick);

        const firstSubCatBtn = categoryContainer.querySelector('.sidebar-subcategory-btn');
        firstSubCatBtn.classList.add('active');
        const firstSubCatList = firstSubCatBtn.parentElement;
        firstSubCatList.style.maxHeight = firstSubCatList.scrollHeight + "px";
        firstSubCatList.previousElementSibling.querySelector('svg').style.transform = 'rotate(180deg)';

        displayExerciseForSubcategory();
    };
</script>
</body>
</html>
