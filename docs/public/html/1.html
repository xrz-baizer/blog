<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词本编辑器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: #f8f9fa;
        }
        h1 {
            text-align: center;
            color: #0056b3;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #upload-section {
            border: 2px dashed #007bff;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #file-input {
            display: none;
        }
        #upload-label {
            cursor: pointer;
            color: #007bff;
            font-weight: bold;
        }
        #upload-label:hover {
            text-decoration: underline;
        }
        #controls, #export-section {
            display: none; /* Initially hidden */
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        #select-all-container {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }
        #select-all {
            margin-right: 5px;
        }
        .word-list {
            list-style: none;
            padding: 0;
        }
        .word-item {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }
        .word-item:last-child {
            border-bottom: none;
        }
        .word-item:hover {
            background-color: #f1f3f5;
        }
        .word-item input[type="checkbox"] {
            margin-top: 5px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .word-content {
            flex-grow: 1;
        }
        .word-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #495057;
        }
        .word-trans {
            font-size: 0.9em;
            color: #6c757d;
            padding-left: 1.2em; /* Indent translations */
        }
        .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 1.2em;
            margin-left: 15px;
            flex-shrink: 0;
            padding: 5px;
        }
        .delete-btn:hover {
            color: #a0232f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>单词本编辑器</h1>

    <div id="upload-section">
        <label for="file-input" id="upload-label">点击此处上传您的 JSON 单词本</label>
        <input type="file" id="file-input" accept=".json">
        <p id="file-name-display"></p>
    </div>

    <div id="controls">
        <div id="select-all-container">
            <input type="checkbox" id="select-all">
            <label for="select-all">全选</label>
        </div>
        <button id="bulk-delete-btn" class="btn btn-danger">删除选中</button>
        <button id="export-btn" class="btn btn-success" style="margin-left: auto;">导出剩余单词</button>
    </div>

    <ul id="word-list" class="word-list">
    </ul>
</div>

<script>
    // --- DOM Element References ---
    const fileInput = document.getElementById('file-input');
    const uploadLabel = document.getElementById('upload-label');
    const fileNameDisplay = document.getElementById('file-name-display');
    const controlsDiv = document.getElementById('controls');
    const selectAllCheckbox = document.getElementById('select-all');
    const bulkDeleteBtn = document.getElementById('bulk-delete-btn');
    const exportBtn = document.getElementById('export-btn');
    const wordListUl = document.getElementById('word-list');

    // --- Global State ---
    let vocabulary = [];
    let originalFilename = '';

    // --- Event Listeners ---
    fileInput.addEventListener('change', handleFileSelect);
    selectAllCheckbox.addEventListener('change', handleSelectAll);
    bulkDeleteBtn.addEventListener('click', handleBulkDelete);
    exportBtn.addEventListener('click', handleExport);
    // Use event delegation for dynamically created delete buttons
    wordListUl.addEventListener('click', handleSingleDelete);

    // --- Functions ---

    /**
     * Handles the file upload event. Reads and parses the JSON file.
     */
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        originalFilename = file.name;
        fileNameDisplay.textContent = `已加载: ${originalFilename}`;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const content = e.target.result;
                vocabulary = JSON.parse(content);
                // Add a unique ID to each word for stable referencing
                vocabulary.forEach((word, index) => word.id = `word-${Date.now()}-${index}`);
                renderWordList();
                controlsDiv.style.display = 'flex'; // Show controls
            } catch (error) {
                alert(`文件格式错误，请确保是正确的JSON格式！\n错误详情: ${error.message}`);
                resetApp();
            }
        };
        reader.readAsText(file);
    }

    /**
     * Renders the current vocabulary array to the DOM.
     */
    function renderWordList() {
        wordListUl.innerHTML = ''; // Clear existing list
        if (vocabulary.length === 0) {
            wordListUl.innerHTML = '<li>单词列表为空。</li>';
            return;
        }
        vocabulary.forEach(word => {
            const listItem = document.createElement('li');
            listItem.className = 'word-item';
            listItem.dataset.id = word.id; // Use the unique ID

            // Translations formatted as a list
            const transHtml = word.trans.map(t => `<li>${t}</li>`).join('');

            listItem.innerHTML = `
                    <input type="checkbox" class="word-checkbox" data-id="${word.id}">
                    <div class="word-content">
                        <div class="word-name">${word.name}</div>
                        <ul class="word-trans">${transHtml}</ul>
                    </div>
                    <button class="delete-btn" data-id="${word.id}" title="删除此单词">&times;</button>
                `;
            wordListUl.appendChild(listItem);
        });
        // Reset the 'Select All' checkbox
        selectAllCheckbox.checked = false;
    }

    /**
     * Handles the click on a single delete button using event delegation.
     */
    function handleSingleDelete(event) {
        if (event.target.classList.contains('delete-btn')) {
            const wordIdToDelete = event.target.dataset.id;
            // Filter out the word to be deleted
            vocabulary = vocabulary.filter(word => word.id !== wordIdToDelete);
            renderWordList(); // Re-render the list
        }
    }

    /**
     * Toggles all word checkboxes based on the 'Select All' checkbox.
     */
    function handleSelectAll() {
        const checkboxes = document.querySelectorAll('.word-checkbox');
        checkboxes.forEach(checkbox => {
            checkbox.checked = selectAllCheckbox.checked;
        });
    }

    /**
     * Deletes all selected (checked) words from the list.
     */
    function handleBulkDelete() {
        const checkedCheckboxes = document.querySelectorAll('.word-checkbox:checked');
        if (checkedCheckboxes.length === 0) {
            alert('请先勾选需要删除的单词。');
            return;
        }

        const idsToDelete = new Set();
        checkedCheckboxes.forEach(checkbox => {
            idsToDelete.add(checkbox.dataset.id);
        });

        // Filter out the words to be deleted
        vocabulary = vocabulary.filter(word => !idsToDelete.has(word.id));
        renderWordList(); // Re-render the list
    }

    /**
     * Exports the remaining words into a new JSON file.
     */
    function handleExport() {
        if (vocabulary.length === 0) {
            alert('没有可导出的单词。');
            return;
        }

        // Create a clean version for export (without the temporary 'id' property)
        const dataToExport = vocabulary.map(({ name, trans }) => ({ name, trans }));

        const jsonString = JSON.stringify(dataToExport, null, 2); // Pretty print JSON
        const blob = new Blob([jsonString], { type: 'application/json' });

        // Create the new filename
        const nameParts = originalFilename.split('.');
        const extension = nameParts.pop();
        const newFilename = `${nameParts.join('.')}_selected.${extension}`;

        // Create a temporary link to trigger the download
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = newFilename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href); // Clean up
    }

    /**
     * Resets the application state.
     */
    function resetApp() {
        vocabulary = [];
        originalFilename = '';
        fileInput.value = ''; // Clear file input
        fileNameDisplay.textContent = '';
        wordListUl.innerHTML = '';
        controlsDiv.style.display = 'none';
    }

</script>

</body>
</html>
