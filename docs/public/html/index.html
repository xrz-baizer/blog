<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML 文件列表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #d9f4e4; /* Primary Background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #003716; /* Font Color */
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 6% 18%;
        }
        .header {
            padding: 20px 20px 10px 20px;
        }
        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            color: #003716;
        }
        .inset-group {
            background-color: #e9f8ef; /* Secondary Background */
            border-radius: 12px;
            margin: 0 20px 20px 20px;
            overflow: hidden;
            border-top: 4px solid #4db6ac; /* Accent Color */
            box-shadow: 0 8px 40px 0 rgba(0, 55, 22, 0.15);
        }
        .inset-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .inset-group li {
            border-bottom: 1px solid rgba(0, 55, 22, 0.1);
            position: relative;
        }
        .inset-group li:last-child {
            border-bottom: none;
        }
        .inset-group li a {
            display: block;
            padding: 18px 45px 18px 20px;
            text-decoration: none;
            color: #003716; /* Font Color */
            font-size: 1.33rem;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }
        .inset-group li a::after {
            content: '›';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #4db6ac; /* Accent Color */
            font-size: 22px;
            font-weight: 500;
        }
        .inset-group li:hover {
            background-color: rgba(77, 182, 172, 0.1);
        }
        .inset-group li:hover a {
            padding-left: 25px;
            font-size: 1.5rem;
        }
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #003716;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="page-title">HTML File List</h1>
    </div>

    <div class="inset-group">
        <div id="file-list"></div>
    </div>
    <script>
        // --- 您可以在此数组中手动添加您的HTML文件信息 ---
        // 格式: { name: '网页名称', url: './your-file.html' }
        // "url" 是相对于当前 index.html 文件的路径。
        const files = [
            // English Learning Tools
            { name: 'Wordbook Deduplication Tool (单词本去重工具)', url: 'WordbookDeduplication.html' },
            { name: 'Wordbook Editor (单词本编辑器)', url: 'WordbookEditor.html' },
            { name: 'JSON Format Converter (JSON格式转换器)', url: 'JSONFormatConverter.html' },
            { name: 'Word Converter (单词转换器-XML转JSON/TXT)', url: 'WordConverter.html' },
            { name: 'Audio Lyric Player (音频歌词播放器)', url: 'AudioLyricPlayer.html' },
            { name: 'Ebbinghaus Review Plan Generator (艾宾浩斯复习计划生成器)', url: 'EbbinghausReviewPlanGenerator.html' },
            { name: 'Practice Rewriting Sentences (基础句型改写训练)', url: 'PracticeRewritingSentences.html' },

            // Other Tools
            { name: 'Color Picker (颜色选择器)', url: 'Color.html' },
            { name: 'Proxy Configuration Convert (代理配置转换)', url: 'ProxyConfigurationConvert.html' }
        ];

        const listContainer = document.getElementById('file-list');

        if (!files || files.length === 0) {
            const p = document.createElement('p');
            p.className = 'empty-state';
            p.textContent = '暂无文件。请编辑此HTML文件内的JavaScript数组来添加文件列表。';
            listContainer.appendChild(p);
        } else {
            const ul = document.createElement('ul');
            files.forEach(file => {
                if (file && file.name && file.url) {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = file.url;
                    a.textContent = file.name;
                    li.appendChild(a);
                    ul.appendChild(li);
                }
            });
            listContainer.appendChild(ul);
        }
    </script>
</body>
</html>
