<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordbook Deduplication Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #003716;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#d9f4e4]">

<div class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-[#003716]">Wordbook Deduplication Tool</h1>
            <p class="mt-3 text-lg text-[#003716]/80">Compare two wordbooks to find and clean up duplicates.</p>
        </header>
        <main class="bg-[#e9f8ef] p-6 sm:p-8 rounded-2xl shadow-sm border border-[#bde0c9]">
            <div id="word-lists-container" class="space-y-8">
                <div class="fade-in">
                    <label for="word-list-1" class="block text-sm font-medium text-[#003716] mb-2">Wordbook 1 (Baseline)</label>
                    <div class="relative">
                        <textarea id="word-list-1" rows="8" class="block w-full text-sm p-4 bg-[#d9f4e4] border border-[#bde0c9] rounded-xl focus:ring-[#40c593] focus:border-[#40c593] transition-colors placeholder:text-[#003716]/50" placeholder='[{"name":"hello","trans":["Hi"]},{"name":"world","trans":["The earth"]}]'></textarea>
                        <div id="status-1" class="absolute bottom-3 right-3 text-xs text-[#003716]/60">0 words</div>
                    </div>
                    <div id="error-1" class="text-xs text-red-500 mt-1 h-4"></div>
                </div>
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <label for="word-list-2" class="block text-sm font-medium text-[#003716]">Wordbook 2 (To be processed)</label>
                        <button id="deduplicate-btn" class="px-3 py-1 text-xs font-semibold bg-[#d9f4e4] text-[#003716] rounded-lg hover:bg-[#c8ead8] transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#40c593]">Deduplicate this book</button>
                    </div>
                    <div class="relative">
                        <textarea id="word-list-2" rows="8" class="block w-full text-sm p-4 bg-[#d9f4e4] border border-[#bde0c9] rounded-xl focus:ring-[#40c593] focus:border-[#40c593] transition-all duration-300 placeholder:text-[#003716]/50" placeholder='[{"name":"hello","trans":["Hi"]},{"name":"apple","trans":["A fruit"]}]'></textarea>
                        <div id="status-2" class="absolute bottom-3 right-3 text-xs text-[#003716]/60">0 words</div>
                    </div>
                    <div id="error-2" class="text-xs text-red-500 mt-1 h-4"></div>
                </div>
            </div>
            <div class="mt-8 flex justify-end">
                <button id="compare-btn" class="w-full sm:w-auto px-6 py-2.5 text-base font-semibold bg-[#40c593] text-white rounded-lg shadow-sm hover:bg-[#35a97a] transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#35a97a]">Start Comparison</button>
            </div>
        </main>
        <div id="results-section" class="mt-8 hidden">
            <div class="bg-[#e9f8ef] p-6 sm:p-8 rounded-2xl shadow-sm border border-[#bde0c9] fade-in">
                <h2 class="text-2xl font-bold text-[#003716] mb-6">Analysis Results</h2>
                <div id="duplicates-container"></div>
                <div id="no-duplicates-msg" class="hidden text-center py-8">
                    <i data-lucide="check-circle-2" class="mx-auto w-12 h-12 text-[#40c593]"></i>
                    <p class="mt-4 text-xl font-medium text-[#003716]">Excellent!</p>
                    <p class="mt-2 text-[#003716]/70">No duplicate words from Wordbook 1 were found in Wordbook 2.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();

        const list1Textarea = document.querySelector('#word-list-1');
        const list2Textarea = document.querySelector('#word-list-2');
        const deduplicateBtn = document.querySelector('#deduplicate-btn');
        const compareBtn = document.querySelector('#compare-btn');
        const resultsSection = document.querySelector('#results-section');
        const duplicatesContainer = document.querySelector('#duplicates-container');
        const noDuplicatesMsg = document.querySelector('#no-duplicates-msg');

        const parseList = (textarea, listIndex) => {
            const errorEl = document.querySelector(`#error-${listIndex}`);
            errorEl.textContent = '';
            const content = textarea.value.trim();
            if (!content) return [];
            try {
                const data = JSON.parse(content);
                if (!Array.isArray(data)) throw new Error('Input must be an array.');
                return data.filter(item => item && typeof item.name === 'string');
            } catch (e) {
                errorEl.textContent = `Wordbook ${listIndex} has a JSON format error.`;
                return null;
            }
        };

        const updateWordCount = (textarea, listIndex) => {
            const statusEl = document.querySelector(`#status-${listIndex}`);
            const errorEl = document.querySelector(`#error-${listIndex}`);
            errorEl.textContent = '';
            try {
                const content = textarea.value.trim();
                if (!content) {
                    statusEl.textContent = '0 words';
                    return;
                }
                const data = JSON.parse(content);
                statusEl.textContent = Array.isArray(data) ? `${data.length} words` : 'Format error';
            } catch (e) {
                statusEl.textContent = 'Format error';
            }
        };

        const deduplicateList2 = () => {
            const data = parseList(list2Textarea, 2);
            if (data === null) return;
            const uniqueArray = [];
            const seenWords = new Set();
            for (const item of data) {
                const word = item.name.toLowerCase().trim();
                if (!seenWords.has(word)) {
                    uniqueArray.push(item);
                    seenWords.add(word);
                }
            }
            list2Textarea.value = JSON.stringify(uniqueArray, null, 2);
            updateWordCount(list2Textarea, 2);
            list2Textarea.classList.add('ring-2', 'ring-green-500');
            setTimeout(() => list2Textarea.classList.remove('ring-2', 'ring-green-500'), 1500);
        };

        const compareLists = () => {
            const list1Data = parseList(list1Textarea, 1);
            const list2Data = parseList(list2Textarea, 2);
            if (list1Data === null || list2Data === null) return;
            const list1WordSet = new Set(list1Data.map(item => item.name.toLowerCase().trim()));
            const duplicates = list2Data.filter(item => list1WordSet.has(item.name.toLowerCase().trim()));
            renderResults(duplicates);
        };

        const renderResults = (duplicates) => {
            duplicatesContainer.innerHTML = '';
            resultsSection.classList.remove('hidden');
            if (duplicates.length === 0) {
                noDuplicatesMsg.classList.remove('hidden');
                lucide.createIcons();
                return;
            }
            noDuplicatesMsg.classList.add('hidden');
            const duplicateNames = new Set(duplicates.map(d => d.name.toLowerCase().trim()));
            let html = `<div class="flex flex-wrap justify-between items-center gap-2">
                <div>
                    <h3 class="text-lg font-semibold text-[#003716]">Duplicate Words in Wordbook 2 (${duplicates.length})</h3>
                    <p class="mt-1 text-sm text-[#003716]/70">These words also appear in Wordbook 1.</p>
                </div>
                <div class="flex-shrink-0 flex gap-2">
                    <button id="remove-duplicates-btn" class="px-3 py-1 text-xs font-semibold bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">Remove All</button>
                    <button id="copy-duplicates-btn" class="px-3 py-1 text-xs font-semibold bg-[#d9f4e4] text-[#003716] rounded-lg hover:bg-[#c8ead8] transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#40c593]">Copy List</button>
                </div>
            </div>
            <div class="mt-4 flow-root"><ul role="list" class="-my-4 divide-y divide-[#bde0c9]">`;
            duplicates.sort((a,b) => a.name.localeCompare(b.name)).forEach(item => {
                html += `<li class="flex items-center space-x-4 py-4">
                    <div class="min-w-0 flex-1">
                        <p class="truncate text-base font-bold text-[#40c593]">${item.name}</p>
                        <p class="mt-1 text-sm text-[#003716]/70">${(item.trans || []).join(', ')}</p>
                    </div>
                </li>`;
            });
            html += `</ul></div>`;
            duplicatesContainer.innerHTML = html;

            document.querySelector('#remove-duplicates-btn')?.addEventListener('click', () => {
                const currentList2Data = parseList(list2Textarea, 2);
                if (currentList2Data === null) return;
                const filteredData = currentList2Data.filter(item => !duplicateNames.has(item.name.toLowerCase().trim()));
                list2Textarea.value = JSON.stringify(filteredData, null, 2);
                updateWordCount(list2Textarea, 2);
                compareLists();
            });

            document.querySelector('#copy-duplicates-btn')?.addEventListener('click', (e) => {
                const btn = e.currentTarget;
                const wordsToCopy = duplicates.map(item => item.name).join('\n');
                navigator.clipboard.writeText(wordsToCopy).then(() => {
                    btn.textContent = 'Copied!';
                    setTimeout(() => { btn.textContent = 'Copy List'; }, 2000);
                });
            });
        };

        list1Textarea.addEventListener('input', () => updateWordCount(list1Textarea, 1));
        list2Textarea.addEventListener('input', () => updateWordCount(list2Textarea, 2));
        deduplicateBtn.addEventListener('click', deduplicateList2);
        compareBtn.addEventListener('click', compareLists);
    });
</script>
</body>
</html>
