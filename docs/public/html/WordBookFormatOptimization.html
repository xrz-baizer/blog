<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式转换器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 使用更符合 Apple 平台的字体栈 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Noto Sans SC",
            Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji",
            "Segoe UI Emoji", "Segoe UI Symbol";
            background-image: radial-gradient(circle at top left, hsla(210, 80%, 95%, 0.5), transparent 40%),
            radial-gradient(circle at bottom right, hsla(340, 70%, 95%, 0.5), transparent 40%);
        }

        /* 自定义滚动条样式，使其更纤细、柔和 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #d1d5db; /* gray-300 */
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #9ca3af; /* gray-400 */
        }

        /* 定义一个平滑的过渡效果，用于所有交互元素 */
        .smooth-transition {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen p-4 antialiased">

<!-- 主容器，采用磨砂玻璃效果和柔和阴影 -->
<div class="w-full max-w-7xl bg-white/70 backdrop-blur-xl border border-gray-200/80 rounded-2xl shadow-lg p-6 md:p-8">

    <!-- 头部信息 -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-semibold text-gray-900">JSON 格式转换器</h1>
        <p class="text-gray-600 mt-2">将标准格式的 JSON 数组，转换为内部对象单行显示的格式。</p>
    </div>

    <!-- 输入输出区域 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 输入 -->
        <div>
            <label for="inputJson" class="block text-sm font-medium text-gray-700 mb-2">输入 JSON</label>
            <textarea id="inputJson" rows="15" class="custom-scrollbar w-full p-3 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 smooth-transition text-gray-800 font-mono text-sm" placeholder="在这里粘贴你的 JSON..."></textarea>
        </div>
        <!-- 输出 -->
        <div>
            <label for="outputJson" class="block text-sm font-medium text-gray-700 mb-2">输出结果</label>
            <div class="relative">
                <textarea id="outputJson" rows="15" readonly class="custom-scrollbar w-full p-3 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 smooth-transition text-gray-800 font-mono text-sm" placeholder="转换结果将显示在这里..."></textarea>
                <!-- 复制按钮，增加了图标 -->
                <button id="copyBtn" class="absolute top-2.5 right-2.5 flex items-center justify-center h-8 w-8 bg-gray-200 hover:bg-gray-300 text-gray-600 rounded-full smooth-transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="smooth-transition"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <svg id="checkIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 hidden smooth-transition"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="mt-8 text-center">
        <button id="convertBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg shadow-md hover:shadow-lg transform hover:scale-105 active:scale-100 smooth-transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            转换格式
        </button>
    </div>

</div>

<script>
    const inputJsonEl = document.getElementById('inputJson');
    const outputJsonEl = document.getElementById('outputJson');
    const convertBtn = document.getElementById('convertBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyIcon = document.getElementById('copyIcon');
    const checkIcon = document.getElementById('checkIcon');

    // 默认填充示例数据
    inputJsonEl.value = JSON.stringify([
        {
            "name": "unbiased",
            "trans": [
                "adj. 公正的,无偏见的 (fair)"
            ]
        },
        {
            "name": "uniform",
            "trans": [
                "adj. 始终如一的 (consistent)"
            ]
        },
        {
            "name": "uphold",
            "trans": [
                "vt. 支持,维护 (support, maintain)"
            ]
        }
    ], null, 2);

    convertBtn.addEventListener('click', () => {
        const input_text = inputJsonEl.value.trim();
        if (!input_text) {
            outputJsonEl.value = '错误：输入内容不能为空。';
            return;
        }

        try {
            const parsed_json = JSON.parse(input_text);

            if (!Array.isArray(parsed_json)) {
                outputJsonEl.value = '错误：输入内容必须是一个有效的 JSON 数组。';
                return;
            }

            const result_lines = parsed_json.map(item => JSON.stringify(item));

            const final_output = `[\n${result_lines.join(',\n')}\n]`;

            outputJsonEl.value = final_output;

        } catch (error) {
            outputJsonEl.value = `错误：无效的 JSON 格式。\n\n详细信息: ${error.message}`;
        }
    });

    copyBtn.addEventListener('click', () => {
        if (!outputJsonEl.value || outputJsonEl.value.startsWith('错误')) {
            return;
        }

        // 使用 Clipboard API，更现代的方法
        navigator.clipboard.writeText(outputJsonEl.value).then(() => {
            // 提供视觉反馈
            copyIcon.classList.add('hidden');
            checkIcon.classList.remove('hidden');

            setTimeout(() => {
                copyIcon.classList.remove('hidden');
                checkIcon.classList.add('hidden');
            }, 2000);
        }).catch(err => {
            console.error('无法复制文本: ', err);
            // 如果 Clipboard API 失败，可以回退到旧方法
            // 但在这个环境中通常是可用的
        });
    });
</script>
</body>
</html>
